<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechPulse — Мировые тесты и обзоры техники</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .card { background-color: #1e293b; transition: transform 0.2s; }
        .card:hover { transform: translateY(-4px); }
    </style>
</head>
<body class="font-sans antialiased">

    <!-- Шапка -->
    <header class="border-b border-slate-800 bg-slate-900 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="#" onclick="showHome()" class="text-xl font-bold text-blue-400 flex items-center gap-2">
                ⚡ TechPulse <span class="text-xs bg-blue-900 text-blue-200 px-2 py-0.5 rounded">Lab</span>
            </a>
            <span class="text-xs text-slate-400">Автономный дайджест гаджетов</span>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="max-w-5xl mx-auto px-4 py-8" id="app">
        <div class="text-center py-12 text-slate-400">Загрузка свежих материалов...</div>
    </main>

    <!-- Подвал -->
    <footer class="border-t border-slate-800 text-center py-6 text-sm text-slate-500">
        &copy; TechPulse — Автоматический агрегатор зарубежных обзоров.
    </footer>

    <script>
        let postsData = [];

        async function loadPosts() {
            try {
                const res = await fetch('posts.json');
                postsData = await res.json();
                handleRoute();
            } catch (e) {
                document.getElementById('app').innerHTML = `
                    <div class="text-center py-12 text-slate-400">
                        <h2 class="text-xl text-white mb-2">Сайт ждет первую публикацию!</h2>
                        <p>Автоматический робот скоро соберет и переведет первые статьи. Обновите страницу через пару минут.</p>
                    </div>`;
            }
        }

        function handleRoute() {
            const hash = window.location.hash.substring(1);
            if (hash) {
                const post = postsData.find(p => p.slug === hash);
                if (post) renderSinglePost(post);
                else renderHome();
            } else {
                renderHome();
            }
        }

        function renderHome() {
            document.title = "TechPulse — Главная";
            let html = `
                <h1 class="text-2xl font-bold mb-6 text-slate-100">🔥 Свежие тесты и обзоры техники</h1>
                <div class="grid md:grid-cols-2 gap-6">
            `;
            postsData.forEach(post => {
                html += `
                    <div class="card p-5 rounded-xl border border-slate-800 flex flex-col justify-between">
                        <div>
                            <div class="text-xs text-blue-400 font-semibold mb-2">${post.category || 'Обзоры'} • ${post.date}</div>
                            <h2 class="text-lg font-bold mb-2 text-white hover:text-blue-300">
                                <a href="#${post.slug}">${post.title}</a>
                            </h2>
                            <p class="text-sm text-slate-400 line-clamp-3 mb-4">${post.description}</p>
                        </div>
                        <a href="#${post.slug}" class="text-sm font-medium text-blue-400 hover:underline flex items-center gap-1">
                            Читать полностью →
                        </a>
                    </div>
                `;
            });
            html += `</div>`;
            document.getElementById('app').innerHTML = html;
        }

        function renderSinglePost(post) {
            document.title = `${post.title} — Тесты устройства`;
            document.getElementById('app').innerHTML = `
                <button onclick="showHome()" class="text-sm text-blue-400 mb-6 hover:underline">← Назад к списку</button>
                <article class="prose prose-invert max-w-none">
                    <span class="text-xs text-blue-400 font-semibold">${post.category || 'Обзоры'} • ${post.date}</span>
                    <h1 class="text-3xl font-bold text-white mt-2 mb-4">${post.title}</h1>
                    <div class="p-4 bg-slate-800/50 border border-slate-700 rounded-lg text-slate-300 mb-6 text-sm">
                        <strong>Краткий итог:</strong> ${post.description}
                    </div>
                    <div class="text-slate-300 leading-relaxed space-y-4">
                        ${post.content}
                    </div>
                </article>
            `;
        }

        function showHome() {
            window.location.hash = '';
            renderHome();
        }

        window.addEventListener('hashchange', handleRoute);
        loadPosts();
    </script>
</body>
</html>
