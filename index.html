<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechPulse — Мировые тесты, обзоры и гаджеты</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#131c2e',
                        borderCol: '#1e293b'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0b0f19; color: #f8fafc; }
        .card { background-color: #131c2e; border: 1px solid #1e293b; transition: all 0.2s ease; }
        .card:hover { border-color: #3b82f6; transform: translateY(-2px); }
    </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- Верхняя панель -->
    <header class="border-b border-borderCol bg-darkBg/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <a href="#" onclick="showHome()" class="text-xl font-black text-blue-400 flex items-center gap-2 tracking-wide">
                ⚡ TECH<span class="text-white">PULSE</span> <span class="text-[10px] bg-blue-600/30 text-blue-300 px-2 py-0.5 rounded border border-blue-500/30">PRO HUB</span>
            </a>
            
            <!-- Категории в шапке -->
            <nav class="flex flex-wrap items-center gap-2 text-xs font-medium" id="categoryNav">
                <button onclick="filterCategory('all')" class="cat-btn px-3 py-1.5 rounded-lg bg-blue-600 text-white transition">Все материалы</button>
                <button onclick="filterCategory('Смартфоны')" class="cat-btn px-3 py-1.5 rounded-lg bg-cardBg text-slate-300 hover:text-white transition">📱 Смартфоны</button>
                <button onclick="filterCategory('Железо')" class="cat-btn px-3 py-1.5 rounded-lg bg-cardBg text-slate-300 hover:text-white transition">💻 Железо & ПК</button>
                <button onclick="filterCategory('Гаджеты')" class="cat-btn px-3 py-1.5 rounded-lg bg-cardBg text-slate-300 hover:text-white transition">🎧 Гаджеты</button>
            </nav>
        </div>
    </header>

    <!-- Основной контейнер -->
    <main class="max-w-6xl mx-auto px-4 py-8 w-full flex-grow" id="app">
        <div class="text-center py-20 text-slate-400">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent mb-4"></div>
            <p>Загрузка базы данных статей...</p>
        </div>
    </main>

    <!-- Подвал с картой сайта -->
    <footer class="border-t border-borderCol bg-darkBg mt-12 py-8 text-xs text-slate-400">
        <div class="max-w-6xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-4 text-center md:text-left">
            <div>
                <p class="font-bold text-slate-200 mb-1">TechPulse Pro — Автоматический агрегатор обзоров</p>
                <p>&copy; 2026 Все права защищены. Материалы переведены из зарубежных источников.</p>
            </div>
            <div class="flex gap-4">
                <a href="sitemap.xml" target="_blank" class="text-blue-400 hover:underline">🗺️ XML Карта сайта</a>
                <a href="#" onclick="showHome()" class="hover:text-white">На главную</a>
            </div>
        </div>
    </footer>

    <script>
        let postsData = [];
        let currentCategory = 'all';

        async function loadPosts() {
            try {
                const res = await fetch('posts.json?' + new Date().getTime());
                postsData = await res.json();
                handleRoute();
            } catch (e) {
                document.getElementById('app').innerHTML = `
                    <div class="max-w-md mx-auto card p-8 rounded-2xl text-center">
                        <h2 class="text-xl font-bold text-white mb-2">⚡ База данных пуста</h2>
                        <p class="text-sm text-slate-400 mb-4">Робот еще не выкачал статьи. Перейдите во вкладку <b>Actions</b> на GitHub и нажмите <b>Run workflow</b>, чтобы запустить сборку прямо сейчас!</p>
                    </div>`;
            }
        }

        function handleRoute() {
            const hash = window.location.hash.substring(1);
            if (hash) {
                const post = postsData.find(p => p.slug === hash);
                if (post) renderSinglePost(post);
                else renderHome();
            } else {
                renderHome();
            }
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white');
                btn.classList.add('bg-cardBg', 'text-slate-300');
            });
            event.target.classList.add('bg-blue-600', 'text-white');
            event.target.classList.remove('cardBg', 'text-slate-300');
            renderHome();
        }

        function renderHome() {
            document.title = "TechPulse — Мировые тесты и обзоры техники";
            let filtered = postsData;
            if (currentCategory !== 'all') {
                filtered = postsData.filter(p => p.category === currentCategory);
            }

            let html = `
                <div class="mb-8 bg-gradient-to-r from-blue-900/20 to-indigo-900/20 border border-blue-500/20 p-6 rounded-2xl">
                    <h1 class="text-2xl md:text-3xl font-extrabold text-white mb-2">Лабораторные тесты и инсайды</h1>
                    <p class="text-sm text-slate-400">Свежие переведенные обзоры мировой электроники, смартфонов и комплектующих в режиме реального времени.</p>
                </div>
                <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
            `;

            if (filtered.length === 0) {
                html += `<div class="col-span-full text-center py-12 text-slate-500">В этой категории пока нет материалов.</div>`;
            }

            filtered.forEach(post => {
                html += `
                    <div class="card p-5 rounded-2xl flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-center text-xs text-blue-400 font-semibold mb-3">
                                <span class="bg-blue-500/10 px-2.5 py-1 rounded-md border border-blue-500/20">${post.category || 'Обзоры'}</span>
                                <span class="text-slate-500">${post.date}</span>
                            </div>
                            <h2 class="text-base font-bold mb-3 text-white hover:text-blue-300 leading-snug">
                                <a href="#${post.slug}">${post.title}</a>
                            </h2>
                            <p class="text-xs text-slate-400 line-clamp-3 mb-4 leading-relaxed">${post.description}</p>
                        </div>
                        <a href="#${post.slug}" class="text-xs font-semibold text-blue-400 hover:text-blue-300 flex items-center gap-1 mt-auto pt-4 border-t border-borderCol">
                            Читать разбор целиком →
                        </a>
                    </div>
                `;
            });
            html += `</div>`;
            document.getElementById('app').innerHTML = html;
        }

        function renderSinglePost(post) {
            document.title = `${post.title} — Тесты и характеристики`;
            document.getElementById('app').innerHTML = `
                <div class="max-w-3xl mx-auto">
                    <button onclick="showHome()" class="text-xs text-blue-400 font-medium mb-6 hover:underline flex items-center gap-1">← Вернуться к списку статей</button>
                    
                    <article class="card p-6 md:p-8 rounded-3xl">
                        <div class="flex items-center gap-3 text-xs text-blue-400 font-semibold mb-4">
                            <span class="bg-blue-500/10 px-2.5 py-1 rounded-md border border-blue-500/20">${post.category || 'Обзоры'}</span>
                            <span class="text-slate-500">•</span>
                            <span class="text-slate-400">${post.date}</span>
                        </div>
                        
                        <h1 class="text-2xl md:text-3xl font-black text-white mb-6 leading-tight">${post.title}</h1>
                        
                        <div class="p-4 bg-blue-950/30 border border-blue-500/20 rounded-xl text-slate-300 mb-6 text-sm leading-relaxed">
                            <strong class="text-blue-400 block mb-1">Краткий вердикт лаборатории:</strong> ${post.description}
                        </div>
                        
                        <div class="text-slate-300 leading-relaxed space-y-4 text-sm md:text-base border-t border-borderCol pt-6">
                            ${post.content}
                        </div>
                    </article>
                </div>
            `;
        }

        function showHome() {
            window.location.hash = '';
            renderHome();
        }

        window.addEventListener('hashchange', handleRoute);
        loadPosts();
    </script>
</body>
</html>
