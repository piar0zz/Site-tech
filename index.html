
<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Мета-теги -->
    <title id="pageTitle">ТехноОбзор — Свежие тесты, обзоры смартфонов, железа и бытовой техники</title>
    <meta name="description" content="Независимые обзоры мировой техники, смартфонов, компьютерного железа, гаджетов и умного дома с результатами лабораторных тестов." id="metaDescription">
    <meta name="keywords" content="обзоры техники, тесты смартфонов, видеокарты, умный дом, бытовая техника, гаджеты">
    <meta name="author" content="ТехноОбзор">
    
    <!-- Open Graph для соцсетей и мессенджеров (VK, Telegram) -->
    <meta property="og:title" content="ТехноОбзор — Тесты и обзоры техники">
    <meta property="og:description" content="Актуальные переведенные обзоры мировой электроники и гаджетов.">
    <meta property="og:type" content="website">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#131c2e',
                        borderCol: '#1e293b'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0b0f19; color: #f8fafc; }
        .card { background-color: #131c2e; border: 1px solid #1e293b; transition: all 0.2s ease; }
        .card:hover { border-color: #3b82f6; transform: translateY(-2px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-blue-600 selection:text-white">

    <!-- Шапка -->
    <header class="border-b border-borderCol bg-darkBg/90 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-3">
            <div class="flex justify-between items-center w-full md:w-auto">
                <a href="#" onclick="showHome()" class="text-lg md:text-xl font-black text-blue-400 flex items-center gap-2 tracking-wide">
                    🚀 ТЕХНО<span class="text-white">ОБЗОР</span> <span class="text-[9px] bg-blue-600/30 text-blue-300 px-2 py-0.5 rounded border border-blue-500/30">PRO HUB</span>
                </a>
            </div>
            
            <nav class="flex items-center gap-2 text-xs font-medium w-full md:w-auto overflow-x-auto no-scrollbar pb-1 md:pb-0" id="categoryNav">
                <button onclick="filterCategory('all')" class="cat-btn whitespace-nowrap px-3 py-1.5 rounded-lg bg-blue-600 text-white transition shadow-sm">Все</button>
                <button onclick="filterCategory('Смартфоны')" class="cat-btn whitespace-nowrap px-3 py-1.5 rounded-lg bg-cardBg text-slate-300 hover:text-white transition">📱 Смартфоны</button>
                <button onclick="filterCategory('Железо')" class="cat-btn whitespace-nowrap px-3 py-1.5 rounded-lg bg-cardBg text-slate-300 hover:text-white transition">💻 Железо</button>
                <button onclick="filterCategory('Гаджеты')" class="cat-btn whitespace-nowrap px-3 py-1.5 rounded-lg bg-cardBg text-slate-300 hover:text-white transition">🎧 Гаджеты</button>
                <button onclick="filterCategory('Бытовая техника')" class="cat-btn whitespace-nowrap px-3 py-1.5 rounded-lg bg-cardBg text-slate-300 hover:text-white transition">🏠 Бытовая техника</button>
            </nav>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="max-w-6xl mx-auto px-4 py-6 md:py-8 w-full flex-grow" id="app">
        <div class="text-center py-20 text-slate-400">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent mb-4"></div>
            <p class="text-sm">Загрузка базы данных...</p>
        </div>
    </main>

    <!-- Подвал -->
    <footer class="border-t border-borderCol bg-darkBg mt-12 py-8 text-xs text-slate-400">
        <div class="max-w-6xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-4 text-center md:text-left">
            <div>
                <p class="font-bold text-slate-200 mb-1">«ТехноОбзор» — Независимый агрегатор тестов</p>
                <p>&copy; 2026 Все права защищены.</p>
            </div>
            <div class="flex flex-wrap justify-center gap-4">
                <a href="rss.xml" target="_blank" class="text-amber-400 hover:underline flex items-center gap-1">📡 RSS-лента</a>
                <a href="sitemap.xml" target="_blank" class="text-blue-400 hover:underline flex items-center gap-1">🗺️ Карта сайта</a>
                <a href="#" onclick="showHome()" class="hover:text-white">На главную</a>
            </div>
        </div>
    </footer>

    <script>
        let postsData = [];
        let currentCategory = 'all';

        async function loadPosts() {
            try {
                const res = await fetch('posts.json?' + new Date().getTime());
                postsData = await res.json();
                handleRoute();
            } catch (e) {
                document.getElementById('app').innerHTML = `<div class="text-center py-12 text-slate-400 text-sm">Статьи скоро появятся. Запустите воркфлоу на GitHub Actions.</div>`;
            }
        }

        function handleRoute() {
            const hash = window.location.hash.substring(1);
            if (hash) {
                const post = postsData.find(p => p.slug === hash);
                if (post) renderSinglePost(post);
                else renderHome();
            } else {
                renderHome();
            }
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white', 'shadow-sm');
                btn.classList.add('bg-cardBg', 'text-slate-300');
            });
            event.target.classList.add('bg-blue-600', 'text-white', 'shadow-sm');
            event.target.classList.remove('bg-cardBg', 'text-slate-300');
            renderHome();
        }

        function renderHome() {
            document.getElementById('pageTitle').innerText = "ТехноОбзор — Свежие тесты, обзоры смартфонов, железа и бытовой техники";
            document.getElementById('metaDescription').setAttribute("content", "Независимые обзоры мировой техники, смартфонов, компьютерного железа, гаджетов и умного дома с результатами лабораторных тестов.");
            
            let filtered = postsData;
            if (currentCategory !== 'all') {
                filtered = postsData.filter(p => p.category === currentCategory);
            }

            let html = `
                <div class="mb-6 md:mb-8 bg-gradient-to-r from-blue-900/20 to-indigo-900/20 border border-blue-500/20 p-5 md:p-6 rounded-2xl">
                    <h1 class="text-xl md:text-3xl font-extrabold text-white mb-2">Обзоры техники, гаджетов и умного дома</h1>
                    <p class="text-xs md:text-sm text-slate-400">Экспертные переведенные материалы, характеристики и результаты независимых тестов со всего мира.</p>
                </div>
                <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">
            `;

            if (filtered.length === 0) {
                html += `<div class="col-span-full text-center py-12 text-slate-500 text-sm">В этой категории пока нет материалов.</div>`;
            }

            filtered.forEach(post => {
                html += `
                    <div class="card p-4 md:p-5 rounded-2xl flex flex-col justify-between shadow-md">
                        <div>
                            <div class="flex justify-between items-center text-[11px] text-blue-400 font-semibold mb-3">
                                <span class="bg-blue-500/10 px-2.5 py-1 rounded-md border border-blue-500/20">${post.category || 'Обзоры'}</span>
                                <span class="text-slate-500">${post.date}</span>
                            </div>
                            <h2 class="text-sm md:text-base font-bold mb-3 text-white hover:text-blue-300 leading-snug">
                                <a href="#${post.slug}">${post.title}</a>
                            </h2>
                            <p class="text-xs text-slate-400 line-clamp-3 mb-4 leading-relaxed">${post.description}</p>
                        </div>
                        <a href="#${post.slug}" class="text-xs font-semibold text-blue-400 hover:text-blue-300 flex items-center gap-1 mt-auto pt-4 border-t border-borderCol">
                            Читать подробный разбор →
                        </a>
                    </div>
                `;
            });
            html += `</div>`;
            document.getElementById('app').innerHTML = html;
        }

        function renderSinglePost(post) {
            // Динамически меняем SEO-тайтл статьи для поисковиков
            document.getElementById('pageTitle').innerText = `${post.title} — Читать обзор на ТехноОбзор`;
            document.getElementById('metaDescription').setAttribute("content", post.description);

            document.getElementById('app').innerHTML = `
                <div class="max-w-3xl mx-auto">
                    <button onclick="showHome()" class="text-xs text-blue-400 font-medium mb-6 hover:underline flex items-center gap-1">← Вернуться к списку статей</button>
                    
                    <article class="card p-5 md:p-10 rounded-3xl shadow-xl">
                        <div class="flex items-center gap-3 text-xs text-blue-400 font-semibold mb-4">
                            <span class="bg-blue-500/10 px-2.5 py-1 rounded-md border border-blue-500/20">${post.category || 'Обзоры'}</span>
                            <span class="text-slate-500">•</span>
                            <span class="text-slate-400">${post.date}</span>
                        </div>
                        
                        <h1 class="text-xl md:text-3xl font-black text-white mb-6 leading-tight">${post.title}</h1>
                        
                        <div class="text-slate-300 leading-relaxed space-y-4 text-sm md:text-base">
                            ${post.content}
                        </div>
                    </article>
                </div>
            `;
        }

        function showHome() {
            window.location.hash = '';
            renderHome();
        }

        window.addEventListener('hashchange', handleRoute);
        loadPosts();
    </script>
</body>
</html>
