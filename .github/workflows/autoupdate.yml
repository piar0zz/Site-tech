
name: Auto Translate & Update Tech News

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install deep-translator

      - name: Run Parser and Translator
        run: python autoparser.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'TechBot'
          git config --global user.email 'bot@github.com'
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git pull origin main --rebase || echo "No rebase needed"
          git add posts.json sitemap.xml rss.xml
          git commit -m "Auto-translate and update tech posts, sitemap & RSS" || exit 0
          git push origin main
